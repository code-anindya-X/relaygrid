services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relaygrid}
      POSTGRES_USER: ${POSTGRES_USER:-relaygrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - relaygrid-postgres:/var/lib/postgresql/data
      - ./infra/postgres/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./infra/postgres/002-proofline-admin.sql:/docker-entrypoint-initdb.d/002-proofline-admin.sql:ro
      - ./infra/postgres/003-oncall.sql:/docker-entrypoint-initdb.d/003-oncall.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relaygrid} -d ${POSTGRES_DB:-relaygrid}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  relaygrid-postgres:
